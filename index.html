<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Lost In Space</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="img/icon.svg">
    <link rel="apple-touch-icon" href="img/icon-192.png">
    <meta name="theme-color" content="#04040c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Lost In Space">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        #rotate-prompt {
            display: none;
            color: #eaffff;
            font-family: monospace;
            font-size: 20px;
            text-align: center;
            padding: 0 30px;
        }
        @media (orientation: portrait) {
            #myCanvas {
                display: none;
            }
            #rotate-prompt {
                display: block;
            }
        }
    </style>
</head>
<body>
<canvas id="myCanvas" width="900" height="640" style="border:1px solid #222; background-color:#04040c; box-shadow:0 0 20px rgba(90,60,180,0.35); touch-action:none;"></canvas>
<div id="rotate-prompt">Please rotate your device to landscape.</div>

<script type="text/javascript" src="js/libs/easeljs-1.0.0.min.js"></script>
<script type="text/javascript" src="js/game/levels.js"></script>
<script type="text/javascript" src="js/game/physics.js"></script>
<script type="text/javascript" src="js/game/vector.js"></script>
<script type="text/javascript" src="js/game/preparation.js"></script>
<script type="text/javascript" src="js/game/boot.js"></script>
</body>
</html>
